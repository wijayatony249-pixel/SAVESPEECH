version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: savespeech-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savespeech_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SaveSpeech_SecretPass_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-savespeech}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-savespeech_user} -d $${POSTGRES_DB:-savespeech}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - savespeech-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savespeech-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-savespeech_user}:${POSTGRES_PASSWORD:-SaveSpeech_SecretPass_2026!}@postgres:5432/${POSTGRES_DB:-savespeech}
      JWT_SECRET: ${JWT_SECRET:-gANTI_DENGAN_SECRET_YANG_SANGAT_KUAT_DAN_PANJANG_MIN_32_CHAR!}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      IP_HASH_SECRET: ${IP_HASH_SECRET:-SECRET_HMAC_IP_HASH_MIN_32_CHARS_PANJANG!}
      WHISPER_MODEL_SIZE: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      TEMP_DIR: /tmp/savespeech
      MAX_UPLOAD_MB: 25
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    volumes:
      - whisper_cache:/home/appuser/.cache/huggingface
    networks:
      - savespeech-network

volumes:
  postgres_data:
    driver: local
  whisper_cache:
    driver: local

networks:
  savespeech-network:
    driver: bridge
